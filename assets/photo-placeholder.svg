<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Our little moment</title>
  <desc id="desc">ภาพประกอบช่อดอกไม้สีชมพูและคำว่า you and me</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset=".48" stop-color="#ffedf1"/>
      <stop offset="1" stop-color="#f8d7df"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="62%">
      <stop offset="0" stop-color="#fffdfa" stop-opacity=".96"/>
      <stop offset=".62" stop-color="#fffdfa" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fffdfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#ad6578" flood-opacity=".16"/>
    </filter>
    <g id="daisy">
      <g fill="#fffaf3" stroke="#e7b1bf" stroke-width="1.4">
        <ellipse cx="0" cy="-38" rx="18" ry="38"/>
        <ellipse cx="0" cy="38" rx="18" ry="38"/>
        <ellipse cx="-38" cy="0" rx="38" ry="18"/>
        <ellipse cx="38" cy="0" rx="38" ry="18"/>
        <ellipse cx="-27" cy="-27" rx="17" ry="35" transform="rotate(-45 -27 -27)"/>
        <ellipse cx="27" cy="27" rx="17" ry="35" transform="rotate(-45 27 27)"/>
        <ellipse cx="27" cy="-27" rx="17" ry="35" transform="rotate(45 27 -27)"/>
        <ellipse cx="-27" cy="27" rx="17" ry="35" transform="rotate(45 -27 27)"/>
      </g>
      <circle r="19" fill="#e4b66c"/>
      <circle r="11" fill="#f1d18d" opacity=".7"/>
    </g>
    <g id="pink-flower">
      <g fill="#f6b7c7" stroke="#df92a7" stroke-width="1.2">
        <ellipse cx="0" cy="-34" rx="17" ry="34"/>
        <ellipse cx="0" cy="34" rx="17" ry="34"/>
        <ellipse cx="-34" cy="0" rx="34" ry="17"/>
        <ellipse cx="34" cy="0" rx="34" ry="17"/>
        <ellipse cx="-24" cy="-24" rx="15" ry="31" transform="rotate(-45 -24 -24)"/>
        <ellipse cx="24" cy="24" rx="15" ry="31" transform="rotate(-45 24 24)"/>
        <ellipse cx="24" cy="-24" rx="15" ry="31" transform="rotate(45 24 -24)"/>
        <ellipse cx="-24" cy="24" rx="15" ry="31" transform="rotate(45 -24 24)"/>
      </g>
      <circle r="17" fill="#e9b16e"/>
      <circle r="9" fill="#f5d28f" opacity=".8"/>
    </g>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="450" cy="440" r="360" fill="url(#glow)"/>
  <circle cx="120" cy="170" r="155" fill="#fff5e7" opacity=".8" filter="url(#blur)"/>
  <circle cx="790" cy="330" r="125" fill="#f6c8d3" opacity=".4" filter="url(#blur)"/>

  <path d="M170 936V598c0-214 126-354 280-354s280 140 280 354v338" fill="none" stroke="#dba7b6" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 12" opacity=".65"/>
  <g fill="#dba7b6" opacity=".7">
    <circle cx="155" cy="635" r="3"/><circle cx="746" cy="700" r="3"/>
    <circle cx="203" cy="505" r="2.4"/><circle cx="703" cy="485" r="2.4"/>
    <circle cx="281" cy="365" r="2"/><circle cx="632" cy="333" r="2"/>
  </g>

  <text x="450" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="7" fill="#b57d8c">OUR LITTLE MOMENT</text>
  <text x="450" y="277" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="79" fill="#9b566b">you <tspan fill="#d17e94">♡</tspan> me</text>
  <path d="M305 309c68 12 218 12 290 0" fill="none" stroke="#e1a6b5" stroke-width="3" stroke-linecap="round"/>
  <text x="450" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#b47b8a">a little forever</text>

  <g opacity=".82" fill="#f3b5c6">
    <path d="M735 210c20-21 45-8 37 12-5 13-24 22-24 22s-22-15-24-24c-3-15 11-22 11-10Z"/>
    <path d="M185 300c12-13 28-5 23 8-3 8-15 14-15 14s-14-9-15-15c-2-9 7-13 7-7Z"/>
  </g>
  <g fill="#e5b66f">
    <path d="M715 355l4 12 12 4-12 4-4 12-4-12-12-4 12-4Z"/>
    <path d="M210 245l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
  </g>

  <g filter="url(#shadow)">
    <g fill="none" stroke="#9faf98" stroke-width="4" stroke-linecap="round">
      <path d="M450 790C426 665 363 578 306 486"/>
      <path d="M450 790C460 646 520 557 590 480"/>
      <path d="M450 790C432 693 400 624 380 568"/>
      <path d="M450 790C474 686 512 626 553 577"/>
      <path d="M450 790C450 669 451 589 450 509"/>
    </g>
    <g fill="#a8b99f" opacity=".9">
      <ellipse cx="387" cy="650" rx="43" ry="14" transform="rotate(-34 387 650)"/>
      <ellipse cx="515" cy="638" rx="45" ry="15" transform="rotate(31 515 638)"/>
      <ellipse cx="347" cy="570" rx="37" ry="12" transform="rotate(-55 347 570)"/>
      <ellipse cx="562" cy="552" rx="39" ry="13" transform="rotate(55 562 552)"/>
      <ellipse cx="420" cy="714" rx="34" ry="11" transform="rotate(-20 420 714)"/>
      <ellipse cx="486" cy="690" rx="31" ry="10" transform="rotate(23 486 690)"/>
    </g>

    <path d="M367 773h166l-17 150c-3 27-26 48-54 48h-24c-28 0-51-21-54-48Z" fill="#f7d6d1" stroke="#dca3a9" stroke-width="2.4"/>
    <path d="M388 801h124" fill="none" stroke="#fff8f2" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <path d="M394 848h112" fill="none" stroke="#efc1c4" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <path d="M450 773v-24" stroke="#a8b99f" stroke-width="4" stroke-linecap="round"/>

    <use href="#daisy" transform="translate(306 486) scale(1.25)"/>
    <use href="#pink-flower" transform="translate(590 480) scale(1.28)"/>
    <use href="#daisy" transform="translate(380 568) scale(.8)"/>
    <use href="#pink-flower" transform="translate(553 577) scale(.74)"/>
    <use href="#daisy" transform="translate(450 509) scale(.63)"/>
    <use href="#pink-flower" transform="translate(478 447) scale(.47)"/>
    <use href="#daisy" transform="translate(342 440) scale(.44)"/>
  </g>

  <g transform="translate(450 382) rotate(-4)" filter="url(#shadow)">
    <path d="M0-58v-48" stroke="#d6a0ad" stroke-width="2" stroke-dasharray="3 6" fill="none"/>
    <path d="M-62-53H62l-11 94H-51Z" fill="#fffdf9" stroke="#e5b0be" stroke-width="2"/>
    <circle cx="0" cy="-53" r="5" fill="#e5b0be"/>
    <text x="0" y="-17" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="4" fill="#a35b70">2 YEARS</text>
    <text x="0" y="17" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#a35b70">of us</text>
  </g>

  <g fill="#e9aebe" opacity=".72">
    <path d="M700 810c18-18 39-7 32 10-4 11-21 19-21 19s-19-13-20-21c-3-13 9-19 9-8Z"/>
    <path d="M235 730c13-14 30-5 24 8-3 8-16 15-16 15s-14-10-15-16c-2-10 7-14 7-7Z"/>
  </g>
  <g fill="#e5b66f" opacity=".85">
    <path d="M740 545l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z"/>
    <path d="M175 845l3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/>
  </g>

  <text x="450" y="1042" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#b57d8c">two years of us · and many more to come</text>
</svg>
